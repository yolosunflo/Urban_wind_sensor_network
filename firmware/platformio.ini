; Placeholder: pick the real board once the MCU / LoRa module is chosen.
; Candidates: STM32WL (LoRa built in), ESP32 + SX1276, nRF52 + SX1262.
[env:node]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    jgromes/RadioLib            ; LoRaWAN stack (or MCCI LoRaWAN LMIC)
monitor_speed = 115200
