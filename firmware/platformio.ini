; Seeed LoRa-E5 mini (STM32WLE5JC), Arduino framework (STM32duino)
; Flashing needs an ST-Link on the SWD pins (PA13 SWDIO, PA14 SWCLK, NRST, GND):
; the board has no debug probe. The factory AT firmware is read-protected, so remove the
; protection once with STM32CubeProgrammer before the first upload (this erases it).
[env:node]
platform = ststm32
board = lora_e5_mini
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.0             ; LoRaWAN stack, supports the built-in STM32WL radio
    stm32duino/STM32duino Low Power     ; deep sleep (STOP2) woken by the RTC
    stm32duino/STM32duino RTC
