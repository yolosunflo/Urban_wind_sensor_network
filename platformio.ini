; Seeed LoRa-E5 mini (STM32WLE5JC), Arduino framework (STM32duino)
; Flashing needs an ST-Link on the SWD pins (DIO = PA13, CLK = PA14, RST, GND, 3V3):
; the board has no debug probe. The factory AT firmware is read-protected, so remove the
; protection once with STM32CubeProgrammer before the first upload (see docs/testing.md).
;
;   pio run -e node -t upload               the real node firmware (default)
;   pio run -e test_i2c -t upload           one hardware test (list below, see docs/testing.md)
;   pio device monitor                      read what the board prints (USB-C)
;   pio test -e native                      unit tests on the computer, no board needed

[platformio]
default_envs = node
src_dir     = firmware/src
include_dir = firmware/include
test_dir    = firmware/test

[common]
platform = ststm32
board = lora_e5_mini
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
test_ignore = *                         ; unit tests only run in env:native
lib_deps =
    jgromes/RadioLib@^7.1.0             ; LoRaWAN stack, supports the built-in STM32WL radio
    stm32duino/STM32duino Low Power     ; deep sleep (STOP2) woken by the RTC
    stm32duino/STM32duino RTC

; ---- the real firmware ----
[env:node]
extends = common
build_src_filter = +<*> -<bringup/>

; ---- hardware tests, one small program each (src/bringup/) ----
[env:test_board]
extends = common
build_src_filter = +<bringup/test_board.cpp>

[env:test_i2c]
extends = common
build_src_filter = +<bringup/test_i2c.cpp>

[env:test_temperature]
extends = common
build_src_filter = +<bringup/test_temperature.cpp> +<TemperatureSensor.cpp>

[env:test_as5600]
extends = common
build_src_filter = +<bringup/test_as5600.cpp>

[env:test_reed]
extends = common
build_src_filter = +<bringup/test_reed.cpp> +<Anemometer.cpp>

[env:test_battery]
extends = common
build_src_filter = +<bringup/test_battery.cpp> +<PowerManager.cpp>

[env:test_radio]
extends = common
build_src_filter = +<bringup/test_radio.cpp> +<Transport.cpp> +<PayloadCodec.cpp> +<Calibration.cpp> +<PowerManager.cpp>

[env:test_bench]
extends = common
build_src_filter = +<bringup/test_bench.cpp> +<Anemometer.cpp> +<TemperatureSensor.cpp> +<Calibration.cpp> +<PowerManager.cpp>

; ---- unit tests on the computer (test/test_native/), needs a C++ compiler (gcc or clang) ----
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<Aggregator.cpp> +<PayloadCodec.cpp> +<Calibration.cpp>
build_flags = -std=c++17 -D_USE_MATH_DEFINES